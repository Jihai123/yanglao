name: V2 Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'js/**'
      - 'tests_js/**'
      - 'tests_e2e/**'
      - 'package.json'
      - 'requirements-test.txt'
      - '.github/workflows/v2-quality.yml'
  push:
    branches:
      - 'refactor/v2-retirement-planner'
    paths:
      - 'index.html'
      - 'assets/**'
      - 'js/**'
      - 'tests_js/**'
      - 'tests_e2e/**'
      - 'package.json'
      - 'requirements-test.txt'
      - '.github/workflows/v2-quality.yml'

permissions:
  contents: read

jobs:
  test-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V2 tests
        run: npm run test:v2
      - name: Check browser modules syntax
        run: |
          node --check js/policy.js
          node --check js/projection.js
          node --check js/app.js
          node --check js/sources.js
          node --check js/trust.js
          node --check js/resident.js
          node --check js/resident-ui.js
          node --check js/guidance.js
          node --check js/launch.js
          node --check js/launch-polish.js
          node --check js/analytics.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run V2 browser smoke
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/yanglao-http.log 2>&1 &
          python -m pytest tests_e2e/test_v2_*.py -q
