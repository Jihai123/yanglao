<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>退休规划助手 · 使用看板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ed;
      --card: #fffdf9;
      --ink: #17392f;
      --muted: #6d7771;
      --line: #dedbd2;
      --accent: #1f6756;
      --soft: #eaf4f0;
      --danger: #a33a2e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: #1d2925; }
    button, input { font: inherit; }
    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 26px 0 48px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: 24px; color: var(--ink); }
    h2 { margin: 0 0 14px; font-size: 18px; color: var(--ink); }
    .muted { color: var(--muted); }
    .actions { display: flex; gap: 10px; }
    .btn { border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
    .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .grid { display: grid; gap: 14px; }
    .cards { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 7px 24px rgba(22, 57, 47, .04); }
    .metric span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 9px; }
    .metric strong { display: block; font-size: 28px; line-height: 1; color: var(--ink); }
    .metric small { display: block; margin-top: 8px; color: var(--muted); }
    .two { grid-template-columns: 1.25fr .75fr; margin-top: 14px; }
    .trend-row, .feature-row { display: grid; grid-template-columns: 94px 1fr 70px 70px; gap: 10px; align-items: center; min-height: 34px; border-top: 1px solid #ebe8e0; }
    .trend-row:first-child, .feature-row:first-child { border-top: 0; }
    .bar-wrap { height: 9px; border-radius: 999px; background: #edf0ed; overflow: hidden; }
    .bar { height: 100%; background: var(--accent); border-radius: inherit; min-width: 2px; }
    .feature-row { grid-template-columns: 140px 1fr 60px; }
    .feedback-item { padding: 13px 0; border-top: 1px solid #ebe8e0; }
    .feedback-item:first-child { border-top: 0; padding-top: 0; }
    .feedback-item p { margin: 0 0 6px; white-space: pre-wrap; line-height: 1.55; }
    .feedback-item time { font-size: 12px; color: var(--muted); }
    .empty { padding: 20px 0; color: var(--muted); }
    .login-wrap { min-height: 70vh; display: grid; place-items: center; }
    .login-card { width: min(420px, 100%); }
    .login-card p { color: var(--muted); line-height: 1.6; }
    .login-card input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; background: white; margin: 8px 0 12px; }
    .login-error { color: var(--danger); min-height: 22px; font-size: 13px; }
    .hidden { display: none !important; }
    .foot { text-align: right; margin-top: 12px; font-size: 12px; color: var(--muted); }
    @media (max-width: 900px) {
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .two { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 20px, 1080px); padding-top: 16px; }
      .topbar { align-items: flex-start; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric strong { font-size: 24px; }
      .trend-row { grid-template-columns: 74px 1fr 52px; }
      .trend-row .pv { display: none; }
      .feature-row { grid-template-columns: 112px 1fr 48px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="loginView" class="login-wrap">
      <form id="loginForm" class="card login-card">
        <h1>使用看板</h1>
        <p>输入管理员密码后查看访问、功能使用和最近吐槽。这里不展示用户填写的养老金数据。</p>
        <label for="password">管理员密码</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button class="btn primary" type="submit">进入看板</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </section>

    <section id="dashboardView" class="hidden">
      <header class="topbar">
        <div><h1>退休规划助手 · 使用看板</h1><div class="muted" id="subtitle">今天</div></div>
        <div class="actions"><button class="btn" id="refreshBtn" type="button">刷新</button><button class="btn" id="logoutBtn" type="button">退出</button></div>
      </header>

      <section class="grid cards">
        <div class="card metric"><span>今日访客</span><strong id="mVisitors">0</strong><small>匿名去重</small></div>
        <div class="card metric"><span>今日 PV</span><strong id="mPv">0</strong><small>页面访问</small></div>
        <div class="card metric"><span>到达结果</span><strong id="mResults">0</strong><small>去重访客</small></div>
        <div class="card metric"><span>结果转化率</span><strong id="mConversion">0%</strong><small>结果访客 / 访客</small></div>
        <div class="card metric"><span>功能点击</span><strong id="mClicks">0</strong><small>今日入口点击</small></div>
        <div class="card metric"><span>吐槽提交</span><strong id="mFeedback">0</strong><small>今日提交</small></div>
      </section>

      <section class="grid two">
        <div class="card"><h2>最近 7 天</h2><div id="trendList"></div></div>
        <div class="card"><h2>最近 30 天功能入口</h2><div id="featureList"></div></div>
      </section>

      <section class="card" style="margin-top:14px"><h2>最近吐槽</h2><div id="feedbackList"></div></section>
      <div class="foot" id="generatedAt"></div>
    </section>
  </main>

  <script>
    const API = '/api/admin.php';
    const featureNames = {
      age: '查退休年龄',
      normal: '算退休养老金',
      early: '几年后不工作',
      flex: '离职 / 灵活就业',
      resident: '城乡居民养老',
    };

    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

    function showLogin(message = '') {
      $('dashboardView').classList.add('hidden');
      $('loginView').classList.remove('hidden');
      $('loginError').textContent = message;
      $('password').focus();
    }

    function showDashboard() {
      $('loginView').classList.add('hidden');
      $('dashboardView').classList.remove('hidden');
    }

    function render(data) {
      const today = data.today || {};
      $('mVisitors').textContent = today.visitors || 0;
      $('mPv').textContent = today.page_views || 0;
      $('mResults').textContent = today.result_visitors || 0;
      $('mConversion').textContent = `${Number(today.result_conversion || 0).toFixed(1)}%`;
      $('mClicks').textContent = today.intent_clicks || 0;
      $('mFeedback').textContent = today.feedback_submits || 0;
      $('subtitle').textContent = `累计访客 ${data.total?.visitors || 0} · 累计 PV ${data.total?.page_views || 0}`;

      const trend = data.trend || [];
      const maxVisitors = Math.max(1, ...trend.map(row => Number(row.visitors || 0)));
      $('trendList').innerHTML = trend.length ? trend.map(row => `
        <div class="trend-row">
          <span>${esc(String(row.day).slice(5))}</span>
          <div class="bar-wrap"><div class="bar" style="width:${Math.max(2, Number(row.visitors || 0) / maxVisitors * 100)}%"></div></div>
          <strong>${Number(row.visitors || 0)}</strong>
          <span class="pv muted">结果 ${Number(row.result_visitors || 0)}</span>
        </div>`).join('') : '<div class="empty">还没有记录</div>';

      const features = data.features || [];
      const maxClicks = Math.max(1, ...features.map(row => Number(row.clicks || 0)));
      $('featureList').innerHTML = features.length ? features.map(row => `
        <div class="feature-row">
          <span>${esc(featureNames[row.feature] || row.feature || '其他')}</span>
          <div class="bar-wrap"><div class="bar" style="width:${Math.max(2, Number(row.clicks || 0) / maxClicks * 100)}%"></div></div>
          <strong>${Number(row.clicks || 0)}</strong>
        </div>`).join('') : '<div class="empty">还没有功能点击</div>';

      const feedback = data.feedback || [];
      $('feedbackList').innerHTML = feedback.length ? feedback.map(item => `
        <article class="feedback-item">
          <p>${esc(item.content)}</p>
          <time>${esc(item.created_at)}</time>
        </article>`).join('') : '<div class="empty">还没有吐槽</div>';

      $('generatedAt').textContent = data.generated_at ? `数据生成：${data.generated_at}` : '';
      showDashboard();
    }

    async function loadDashboard() {
      const res = await fetch(API, { credentials: 'same-origin', cache: 'no-store' });
      if (res.status === 401) { showLogin(); return; }
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'load_failed');
      render(data.dashboard);
    }

    $('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      $('loginError').textContent = '正在验证…';
      try {
        const res = await fetch(API, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', password: $('password').value }),
        });
        const data = await res.json();
        if (res.status === 401) { $('loginError').textContent = '密码不对。'; return; }
        if (!res.ok || !data.ok) { $('loginError').textContent = `暂时无法打开：${data.error || res.status}`; return; }
        $('password').value = '';
        render(data.dashboard);
      } catch (error) {
        $('loginError').textContent = '连接失败，请稍后再试。';
      }
    });

    $('refreshBtn').addEventListener('click', () => loadDashboard().catch(() => {}));
    $('logoutBtn').addEventListener('click', async () => {
      await fetch(API, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'logout' }) }).catch(() => {});
      showLogin();
    });

    loadDashboard().catch(() => showLogin('看板接口暂时不可用。'));
  </script>
</body>
</html>
